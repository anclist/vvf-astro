name: Verify menu links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-menu-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-menu-links.mjs
